<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anniversary Magic ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Pacifico&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0512;color:#fff;font-family:"Nunito",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;padding:20px;}
#photoBg{position:fixed;top:-10%;left:-10%;width:120%;height:120%;z-index:0;pointer-events:none;background-size:cover;background-position:center;filter:blur(25px) brightness(0.3) saturate(1.8);transition:opacity 1.5s ease;opacity:0;}
canvas#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.card{position:relative;z-index:10;background:rgba(15,8,25,0.78);border:1px solid rgba(255,0,180,0.3);border-radius:30px;padding:40px 35px;width:95%;max-width:480px;text-align:center;box-shadow:0 0 40px rgba(255,0,180,0.2), inset 0 0 20px rgba(180,0,255,0.15);backdrop-filter:blur(20px);animation:panelFade 0.7s cubic-bezier(0.1, 1, 0.1, 1);}
@keyframes panelFade{from{opacity:0;transform:scale(0.95) translateY(20px);filter:blur(5px);}to{opacity:1;transform:scale(1) translateY(0);filter:blur(0);}}
h1{font-family:'Pacifico',cursive;font-size:2.4rem;margin-bottom:25px;background:linear-gradient(45deg,#ff00a0,#00e5ff,#b000ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(255,0,160,0.4);filter:drop-shadow(0 2px 5px rgba(0,0,0,0.5));}
label{display:block;text-align:left;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;font-weight:900;margin-bottom:6px;color:#00e5ff;margin-left:4px;}
input[type=text],input[type=number],select{width:100%;padding:14px;margin-bottom:16px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.5);color:#fff;font-size:0.95rem;outline:none;font-family:'Nunito',sans-serif;transition:0.3s;box-shadow:inset 0 2px 4px rgba(0,0,0,0.5);}
input:focus,select:focus{border-color:#ff00a0;box-shadow:0 0 12px rgba(255,0,160,0.5), inset 0 2px 4px rgba(0,0,0,0.5);}
select option{background:#140926;color:#fff;}
.photo-upload-btn{width:100%;padding:14px;margin-bottom:16px;border-radius:14px;border:2px dashed rgba(0,229,255,0.3);background:rgba(0,229,255,0.03);color:#00e5ff;font-size:0.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:0.3s;}
.photo-upload-btn:hover{border-color:#ff00a0;background:rgba(255,0,160,0.05);color:#ff00a0;box-shadow:0 0 15px rgba(255,0,160,0.2);}
.photo-preview{width:75px;height:75px;border-radius:50%;object-fit:cover;border:2px solid #ff00a0;display:none;margin:0 auto 12px;box-shadow:0 0 15px #ff00a0;}
.main-btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(45deg,#ff00a0,#7700ff);color:#fff;font-weight:900;font-size:1.05rem;letter-spacing:0.5px;cursor:pointer;font-family:'Orbitron',sans-serif;box-shadow:0 4px 15px rgba(255,0,160,0.4);transition:0.3s;margin-bottom:10px;}
.main-btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(255,0,160,0.6);filter:brightness(1.1);}
.main-btn:active{transform:translateY(1px);}
.main-btn:disabled{background:#333;box-shadow:none;cursor:not-allowed;}
.share-box{margin-top:20px;background:rgba(0,229,255,0.06);padding:18px;border-radius:18px;display:none;border:1px solid rgba(0,229,255,0.25);box-shadow:0 0 20px rgba(0,229,255,0.05);}
.share-link{width:100%;padding:12px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.1);color:#00e5ff;border-radius:10px;font-size:0.85rem;text-align:center;margin-bottom:12px;outline:none;font-family:monospace;}
#bcard{display:none;flex-direction:column;gap:15px;text-align:center;}
.photo-ring{width:140px;height:140px;border-radius:50%;border:4px solid #ff00a0;margin:0 auto 5px;overflow:hidden;display:none;box-shadow:0 0 35px rgba(255,0,160,0.7), inset 0 0 15px rgba(0,0,0,0.5);animation:pulseRing 2s infinite alternate;}
@keyframes pulseRing{from{box-shadow:0 0 25px rgba(255,0,160,0.5);}to{box-shadow:0 0 40px rgba(255,0,160,0.9);}}
.photo-ring img{width:100%;height:100%;object-fit:cover;}
.big-name{font-family:'Pacifico',cursive;font-size:2.5rem;color:#ffd700;text-shadow:0 0 25px rgba(255,215,0,0.6), 0 2px 4px rgba(0,0,0,0.8);line-height:1.3;}
.wish-box{background:rgba(10,5,20,0.7);padding:22px;border-radius:20px;border:1px solid rgba(176,0,255,0.25);border-top:3px solid #b000ff;text-align:left;box-shadow:0 10px 25px rgba(0,0,0,0.4);}
.wish-text{font-size:1.1rem;color:#00e5ff;margin-bottom:12px;line-height:1.6;font-weight:700;text-shadow:0 0 10px rgba(0,229,255,0.2);}
.bless-text{font-size:0.92rem;color:#ccc;font-style:italic;line-height:1.5;}
.music-box{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:16px;box-shadow:inset 0 2px 8px rgba(0,0,0,0.6);}
.music-label{font-size:0.75rem;font-family:'Orbitron',sans-serif;color:#ff00a0;margin-bottom:12px;letter-spacing:1px;font-weight:900;}
.ctrl{display:flex;align-items:center;gap:12px;}
.play-btn{width:50px;height:50px;flex-shrink:0;border-radius:50%;border:none;background:linear-gradient(45deg,#ff00a0,#7700ff);color:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(255,0,160,0.4);transition:0.2s;}
.play-btn:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(255,0,160,0.6);}
.prog-wrap{flex:1;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;cursor:pointer;position:relative;overflow:hidden;}
.prog-bar{height:100%;border-radius:4px;background:linear-gradient(to right,#ff00a0,#00e5ff);width:0%;transition:width 0.1s linear;}
.time-txt{font-size:0.75rem;color:#888;min-width:38px;font-family:monospace;}
.viz{display:flex;align-items:flex-end;gap:3px;height:34px;justify-content:center;margin-top:10px;}
.vbar{width:5px;border-radius:3px;background:linear-gradient(to top,#ff00a0,#00e5ff);transition:height 0.1s ease;}
.back-btn{width:100%;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.02);color:#aaa;font-weight:700;cursor:pointer;font-size:0.9rem;font-family:'Nunito',sans-serif;transition:0.2s;}
.back-btn:hover{background:rgba(255,255,255,0.07);color:#fff;border-color:rgba(255,255,255,0.25);}
.confetti-c{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden;}
.cp{position:absolute;animation:fall linear infinite;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}
.start-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#080312;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:25px;}
</style>
</head>
<body>
<div id="photoBg"></div>
<canvas id="bgCanvas"></canvas>

<div class="start-overlay" id="startOverlay">
  <h1 id="overlayTitle" style="font-size:2.5rem; padding: 0 20px;">💖 Love Surprise 💖</h1>
  <button class="main-btn" style="max-width:220px;" onclick="unlockWish()">Open Gift 🎁</button>
</div>

<div class="card" id="setup">
  <h1>Anniversary Magic 💕</h1>
  <label>Couple Names:</label>
  <input type="text" id="nameInput" placeholder="e.g. Aayush & Shreya">
  <label>Years Completed (optional):</label>
  <input type="number" id="ageInput" placeholder="e.g. 2">
  <label>Choose Language:</label>
  <select id="langSelect">
    <option value="ne_dev" selected>🇳🇵 Nepali (देवनागरी)</option>
    <option value="ne">🇳🇵 Nepali (Romanized)</option>
    <option value="en">🇬🇧 English</option>
    <option value="hi">🇮🇳 Hindi (हिन्दी)</option>
    <option value="sa">🕉️ Sanskrit (संस्कृतम्)</option>
    <option value="ja">🇯🇵 Japanese (日本語)</option>
    <option value="es">🇪🇸 Spanish (Español)</option>
    <option value="fr">🇫🇷 French (Français)</option>
  </select>
  <img class="photo-preview" id="photoPreview" src="" alt="">
  <div class="photo-upload-btn" onclick="document.getElementById('imgFile').click()">
    📷 <span id="uploadLabel">Add Couple Photo (optional)</span>
  </div>
  <input type="file" id="imgFile" accept="image/*" style="display:none">
  <button class="main-btn" id="magicBtn" onclick="generateLink()">Create Magic Link 🚀</button>
  
  <div class="share-box" id="shareBox">
    <input type="text" class="share-link" id="shareUrl" readonly>
    <button class="back-btn" id="copyBtn" style="border-color:#00e5ff; color:#00e5ff;" onclick="copyLink()">📋 Copy Anniversary Link</button>
  </div>
</div>

<div class="card" id="bcard">
  <div class="photo-ring" id="photoRing"><img id="userImg" src="" alt="Couple"></div>
  <p style="letter-spacing:6px;font-size:0.65rem;color:#ff00a0;font-weight:900;font-family:'Orbitron',sans-serif;">HAPPY ANNIVERSARY</p>
  <h2 class="big-name" id="bigName"></h2>
  <div id="ageTag" style="color:#00e5ff;font-weight:900;font-size:0.9rem;font-family:'Orbitron',sans-serif;margin-bottom:5px;"></div>
  <div class="wish-box">
    <div class="wish-text" id="wishBox"></div>
    <div class="bless-text" id="blessBox"></div>
  </div>
  <div class="music-box">
    <p class="music-label" id="musicLabel">🎵 Anniversary Track</p>
    <div class="ctrl">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <div class="time-txt" id="timeTxt">0:00</div>
      <div class="prog-wrap" onclick="seekAudio(event)">
        <div class="prog-bar" id="progBar"></div>
      </div>
    </div>
    <div class="viz" id="viz"></div>
  </div>
  <button class="back-btn" onclick="goBack()">🔄 Create Another Card</button>
</div>

<div class="confetti-c" id="confetti"></div>

<script>
// Cyberpunk Star & Heart Particle Matrix
const bgCanvas=document.getElementById('bgCanvas');const bgCtx=bgCanvas.getContext('2d');let particles=[];
function resizeBg(){bgCanvas.width=window.innerWidth;bgCanvas.height=window.innerHeight;}resizeBg();window.addEventListener('resize',resizeBg);
const BG_COLS=['#ff00a0','#7700ff','#00e5ff','#ffd700'];
for(let i=0; i<70; i++)particles.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*3+1,col:BG_COLS[Math.floor(Math.random()*BG_COLS.length)],vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,o:Math.random()*0.6+0.2,isHeart:Math.random()>0.7});

function drawBg(){
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=bgCanvas.width;if(p.x>bgCanvas.width)p.x=0;if(p.y<0)p.y=bgCanvas.height;if(p.y>bgCanvas.height)p.y=0;
    bgCtx.beginPath();
    if(p.isHeart) {
      bgCtx.fillStyle=p.col+Math.floor(p.o*255).toString(16).padStart(2,'0');
      bgCtx.font = `${p.r*4}px sans-serif`;
      bgCtx.fillText('❤️', p.x, p.y);
    } else {
      bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
      bgCtx.fillStyle=p.col+Math.floor(p.o*255).toString(16).padStart(2,'0');
      bgCtx.fill();
    }
  });
  requestAnimationFrame(drawBg);
}
drawBg();

// Native Anniversary Content (Customized translations)
const langData={
  ne_dev:{wish:(n,a)=>`प्रिय ${n}, विवाह वार्षिकोत्सवको हार्दिक शुभकामना! 🎉 ${a?a+" वर्षको यो सुन्दर यात्रा पूरा गर्नुभएकोमा धेरै बधाई! ":""}यो विशेष दिनले तपाईंहरूको जीवनमा थप प्रेम र खुसी ल्याओस्।`,bless:"तपाईंहरूको जोडी सधैं यसरी नै हाँसिराखोस्, आपसी विश्वास र माया अझ प्रगाढ बन्दै जाओस्। वैवाहिक जीवन सुखमय रहोस्! 🌸",song:"🎵 वार्षिकोत्सव मङ्गल धून"},
  ne:{wish:(n,a)=>`Priya ${n}, Anniversary ko dherai dherai shubhakamana! 🎉 ${a?a+" Barsha ko yo sundar yatra pura garnubhaeko ma badhai chha! ":""}Yo bishes din le tapaiko jiwan ma thap prem ra khusi lyaos.`,bless:"Tapaiko jodi sadhai yestai rami rahos, aapsi bishwas ra maya ajha pragadh bandoos. Happy Anniversary! 💖",song:"🎵 Shubhakamana Dhun"},
  en:{wish:(n,a)=>`Happy Anniversary, ${n}! ${a?"Huge congratulations on completing "+a+" beautiful years together! 🎉 ":""}May your love continue to grow stronger with each passing day.`,bless:"Wishing you both a lifetime of shared laughter, endless love, and beautiful moments. Stay blessed! ✨",song:"🎵 Synthwave Anniversary Anthem"},
  hi:{wish:(n,a)=>`${n} को शादी की सालगिरह की ढेरों शुभकामनाएं! 🎉 ${a?"साथ में "+a+" खूबसूरत साल पूरे करने पर बधाई! ":""}आपका यह अटूट बंधन हमेशा प्यार से महकता रहे।`,bless:"ईश्वर आपकी जोड़ी को हमेशा सलामत रखे, और आपके जीवन में सुख, शांति और समृद्धि दे! 🌺",song:"🎵 सालगिरह मुबारक धुन"},
  sa:{wish:(n,a)=>`प्रिय ${n}, विवाह-वार्षिकोत्सवस्य हार्दिक्यः शुभकामनाः! 🎉 ${a?a+" वर्षाणि सफलतया पूरितानि, वर्धापनम्! ":""}अयं शुभदिवसः युवयोः जीवने अनन्तं प्रेम आनयतु।`,bless:"युवयोः दाम्पत्यजीवनं सुखमयम्, समृद्धं, सर्वदा प्रफुल्लितं च भूयात्। शिवस्ते पन्थानः सन्तु! 🌸",song:"🎵 दाम्पत्य मङ्गलधूनिः"},
  ja:{wish:(n,a)=>`${n}、結婚記念日おめでとうございます！🎉 ${a?"共に"+a+"周年を迎える素晴らしい節目、心からお祝い申し上げます！":""}これからも二人の愛が輝き続けますように。`,bless:"お二人のこれからの人生が、溢れんばかりの幸福、健康、そして素晴らしい笑顔に満ちたものでありますように。✨",song:"🎵 ロマンチック記念日メロディ"}
};

async function fetchTranslation(text, targetLang) {
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`);
    const data = await res.json();
    if (data?.responseData?.translatedText) return data.responseData.translatedText;
  } catch (e) { console.error(e); }
  return text;
}

async function getLangDataAsync(lang, name, age) {
  if (langData[lang]) return { wish: langData[lang].wish(name, age), bless: langData[lang].bless, song: langData[lang].song };
  const baseWish = `Happy Anniversary, ${name}! May this beautiful day bring you endless joy, love, and great milestones together.`;
  const baseBless = `May God bless your beautiful bond with perfect health, deep understanding, and endless togetherness.`;
  const transWish = await fetchTranslation(baseWish, lang);
  const transBless = await fetchTranslation(baseBless, lang);
  
  const sel = document.getElementById('langSelect');
  const txt = sel.options[sel.selectedIndex]?.text.split(' ')[1] || "Love";
  return { wish: transWish, bless: transBless, song: `🎵 ${txt} Anniversary Rhythm` };
}

let photoData=null;
document.getElementById('imgFile').onchange=e=>{
  const reader=new FileReader();
  reader.onload=()=>{
    photoData=reader.result;
    const prev=document.getElementById('photoPreview');
    prev.src=photoData; prev.style.display='block';
    document.getElementById('uploadLabel').textContent='Photo loaded! ✓';
  };
  reader.readAsDataURL(e.target.files[0]);
};

// Anniversary Soft Synth Audio Engine
const AC=window.AudioContext||window.webkitAudioContext;let actx,gainNode,sourceNode,audioBuffer,isPlaying=false,startTime=0,pauseOffset=0,vizBars=[],animId,progTimer;
// Romantic/Sweet Anniversary Melodic Notes
const notes=[392,523,659,784,698,659,587,523,587,659,523,392,523,659,784,880,784,659,698,784,880,988,1047];
const durs=[0.4,0.4,0.4,0.6,0.3,0.3,0.4,0.4,0.4,0.6,0.6,0.4,0.4,0.4,0.6,0.4,0.4,0.4,0.4,0.4,0.4,0.4,1.2];

function buildViz(){const v=document.getElementById('viz');v.innerHTML='';vizBars=[];for(let i=0;i<24;i++){const b=document.createElement('div');b.className='vbar';b.style.height='4px';v.appendChild(b);vizBars.push(b);}}
function animViz(){if(!isPlaying)return;vizBars.forEach(b=>{b.style.height=(4+Math.random()*26)+'px';});animId=setTimeout(animViz,120);}
function stopViz(){clearTimeout(animId);vizBars.forEach(b=>b.style.height='4px');}

async function buildAudio(){
  if(!actx)actx=new AC();gainNode=actx.createGain();gainNode.gain.value=0.35;gainNode.connect(actx.destination);
  const sr=actx.sampleRate,total=durs.reduce((a,b)=>a+b,0);const buf=actx.createBuffer(1,Math.ceil(total*sr),sr),data=buf.getChannelData(0);let t=0;
  // Generating smooth sine waves with a soft romantic envelope
  for(let i=0;i<notes.length;i++){const freq=notes[i],dur=durs[i],ns=Math.floor(dur*sr),off=Math.floor(t*sr);for(let s=0;s<ns&&(off+s)<data.length;s++){const env=s<ns*0.1?s/(ns*0.1):s>ns*0.7?(ns-s)/(ns*0.3):1;data[off+s]=(Math.sin(2*Math.PI*freq*s/sr) + 0.3*Math.sin(4*Math.PI*freq*s/sr))*0.25*env;}t+=dur;}
  audioBuffer=buf;
}

function playAudio(offset=0){if(!audioBuffer)return;if(sourceNode){try{sourceNode.stop();}catch(e){}}sourceNode=actx.createBufferSource();sourceNode.buffer=audioBuffer;sourceNode.loop=true;sourceNode.connect(gainNode);sourceNode.start(0,offset);startTime=actx.currentTime-offset;isPlaying=true;document.getElementById('playBtn').textContent='⏸';updateProg();animViz();}
function pauseAudio(){if(!sourceNode)return;pauseOffset=(actx.currentTime-startTime)%audioBuffer.duration;try{sourceNode.stop();}catch(e){}isPlaying=false;document.getElementById('playBtn').textContent='▶';stopViz();}
function togglePlay(){if(actx.state==='suspended')actx.resume();if(isPlaying)pauseAudio();else playAudio(pauseOffset);}
function seekAudio(e){if(!audioBuffer)return;const rect=e.currentTarget.getBoundingClientRect();pauseOffset=((e.clientX-rect.left)/rect.width)*audioBuffer.duration;if(isPlaying)playAudio(pauseOffset);else document.getElementById('progBar').style.width=((pauseOffset/audioBuffer.duration)*100)+'%';}
function updateProg(){clearInterval(progTimer);progTimer=setInterval(()=>{if(!isPlaying||!audioBuffer)return;const el=(actx.currentTime-startTime)%audioBuffer.duration;document.getElementById('progBar').style.width=(el/audioBuffer.duration*100)+'%';const m=Math.floor(el/60),s=Math.floor(el%60);document.getElementById('timeTxt').textContent=m+':'+(s<10?'0':'')+s;},200);}

// URL Link Generation & Parsing
function generateLink() {
  const name = document.getElementById('nameInput').value.trim() || 'Beautiful Couple';
  const age = document.getElementById('ageInput').value;
  const lang = document.getElementById('langSelect').value;
  const btn = document.getElementById('magicBtn');
  
  btn.disabled = true; btn.textContent = "Crafting Love Link... ⏳";
  const payload = { n: name, a: age, l: lang };
  if(photoData) payload.p = photoData;
  
  const encoded = btoa(encodeURIComponent(JSON.stringify(payload))).replace(/=/g, '');
  const finalUrl = `${window.location.origin}${window.location.pathname}#_love_${encoded}`;
  
  document.getElementById('shareUrl').value = finalUrl;
  document.getElementById('shareBox').style.display = 'block';
  btn.disabled = false; btn.textContent = "Create Magic Link 🚀";
}

function copyLink() {
  const copyText = document.getElementById('shareUrl'); copyText.select();
  navigator.clipboard.writeText(copyText.value);
  const btn = document.getElementById('copyBtn'); btn.textContent = '✓ Copied to Clipboard!';
  setTimeout(() => { btn.textContent = '📋 Copy Anniversary Link'; }, 2000);
}

let receivedData = null;
function checkUrlHash() {
  const hash = window.location.hash;
  if(hash && hash.startsWith('#_love_')) {
    try {
      let base64 = hash.split('_love_')[1];
      while (base64.length % 4) base64 += '=';
      receivedData = JSON.parse(decodeURIComponent(atob(base64)));
      document.getElementById('setup').style.display = 'none';
      document.getElementById('overlayTitle').textContent = `🎁 Surprise for ${receivedData.n}!`;
      document.getElementById('startOverlay').style.display = 'flex';
    } catch(e) { console.error("URL code parsing failed", e); }
  }
}

async function unlockWish() {
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('bcard').style.display = 'flex';
  
  const d = await getLangDataAsync(receivedData.l, receivedData.n, receivedData.a);
  document.getElementById('bigName').textContent = receivedData.n;
  document.getElementById('ageTag').textContent = receivedData.a ? '✨ ' + receivedData.a + ' YEARS OF TOGETHERNESS' : '✨ TOGETHER FOREVER';
  document.getElementById('wishBox').textContent = d.wish;
  document.getElementById('blessBox').textContent = d.bless;
  document.getElementById('musicLabel').textContent = d.song;
  
  const photoBg = document.getElementById('photoBg');
  if(receivedData.p) {
    photoBg.style.backgroundImage = `url(${receivedData.p})`;
    photoBg.style.opacity = '1'; document.getElementById('bgCanvas').style.opacity = '0';
    document.getElementById('photoRing').style.display = 'block';
    document.getElementById('userImg').src = receivedData.p;
  }
  
  buildViz(); launchConfetti(); await buildAudio(); if(actx.state==='suspended') await actx.resume(); playAudio(0);
}

function goBack(){
  pauseAudio(); clearInterval(progTimer);
  window.history.pushState({}, document.title, window.location.pathname);
  document.getElementById('bcard').style.display='none';
  document.getElementById('setup').style.display='block';
  document.getElementById('shareBox').style.display='none';
  document.getElementById('photoRing').style.display='none';
  document.getElementById('photoBg').style.opacity='0';
  document.getElementById('bgCanvas').style.opacity='1';
  document.getElementById('confetti').innerHTML='';
  document.getElementById('photoPreview').style.display='none';
  document.getElementById('uploadLabel').textContent='Add Couple Photo (optional)';
  photoData = null;
}

function launchConfetti(){
  const c=document.getElementById('confetti');c.innerHTML='';
  const cols=['#ff00a0','#7700ff','#00e5ff','#ffd700','#ff4d4d'];
  for(let i=0; i<100; i++){
    const el=document.createElement('div');el.className='cp';
    const isHeart = Math.random() > 0.5;
    if(isHeart){
      el.textContent = '❤️'; el.style.fontSize = `${8+Math.random()*12}px`; el.style.background = 'none';
    } else {
      el.style.background = cols[Math.floor(Math.random()*cols.length)];
      el.style.width = `${5+Math.random()*6}px`; el.style.height = `${5+Math.random()*6}px`;
      el.style.borderRadius = Math.random()>0.4?'50%':'3px';
    }
    el.style.cssText += `left:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*2}s;`;
    c.appendChild(el);
  }
}
window.onload = checkUrlHash;
